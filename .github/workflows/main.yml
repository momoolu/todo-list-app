name: Docker Image CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Tests
        env:
          SQLITE_DB_LOCATION: ./tmp/todos/todo.db
        run: yarn test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Build Docker image locally
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo_app latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0,36,0
        with:
          image-ref: ${{ secrets.Dockerhub_USERNAME }}/todo-app:latest
          format: 'table'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUN_USERNAME }}
          password: ${ secrets.DOCKERHUB_TOKEN}}

      - name: Push SEcure Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
      
